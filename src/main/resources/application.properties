
spring.application.name=${SPRING_APP_NAME:spring-security}


spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.datasource.url=jdbc:mysql://localhost:3306/company_db
#spring.datasource.url=spring.datasource.url=jdbc:mysql://WINDOWS_REACHABLE_IP:3306/spring_security
spring.datasource.username=root
spring.datasource.password=Root@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


spring.cassandra.contact-points=127.0.0.1:9042

spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=customer_keyspace

# Enable table creation
spring.cassandra.schema-action=create_if_not_exists
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}
#server.,servlet.session.,timeout=${SESSION_TIMEOUT:10m}

